apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ include "cloudforge.namespace" . }}
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: '__SMTP_USERNAME__'
      smtp_auth_username: '__SMTP_USERNAME__'
      smtp_auth_password_file: '/etc/alertmanager/secrets/password'
      smtp_require_tls: true

    route:
      receiver: cloudforge-email
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: cloudforge-email
        email_configs:
          - to: '__SMTP_USERNAME__'
            send_resolved: true
{{- if .Values.alertmanager.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: {{ include "cloudforge.namespace" . }}
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.alertmanager.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.alertmanager.persistence.size | quote }}
  {{- with .Values.alertmanager.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ include "cloudforge.namespace" . }}
  labels:
    app: alertmanager
    {{- include "cloudforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.alertmanager.replicaCount }}
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: configure-alertmanager
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              escaped_username="$(printf '%s' "$SMTP_USERNAME" | sed 's/[\/&|]/\\&/g')"
              sed "s|__SMTP_USERNAME__|${escaped_username}|g" /etc/alertmanager-template/alertmanager.yml > /etc/alertmanager-generated/alertmanager.yml
          env:
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp
                  key: username
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config-template
              mountPath: /etc/alertmanager-template
              readOnly: true
            - name: config
              mountPath: /etc/alertmanager-generated
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          args:
            - --config.file=/etc/alertmanager-generated/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-generated
              readOnly: true
            - name: smtp-password
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: alertmanager-config
        - name: config
          emptyDir: {}
        - name: smtp-password
          secret:
            secretName: grafana-smtp
            items:
              - key: password
                path: password
        - name: data
          {{- if .Values.alertmanager.persistence.enabled }}
          persistentVolumeClaim:
            claimName: alertmanager-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ include "cloudforge.namespace" . }}
spec:
  selector:
    app: alertmanager
  ports:
    - name: web
      port: {{ .Values.alertmanager.service.port }}
      targetPort: 9093
  type: ClusterIP
