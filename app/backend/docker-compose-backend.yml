services:
  postgres:
    image: postgres:16
    container_name: cloudforge-postgres-local

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"

    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data

    networks:
      - cloudforge

volumes:
  cloudforge-postgres-data:

networks:
  cloudforge:
    driver: bridge