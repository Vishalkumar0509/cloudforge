name: CloudForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt

      - name: Run Django checks
        working-directory: app/backend
        run: |
          python manage.py check

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/frontend/notes-frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend/notes-frontend
        run: npm ci

      - name: Build React application
        working-directory: app/frontend/notes-frontend
        env:
          REACT_APP_API_URL: http://localhost:8000
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t cloudforge-backend:ci ./app/backend

      - name: Build frontend image
        run: docker build -t cloudforge-frontend:ci ./app/frontend/notes-frontend
