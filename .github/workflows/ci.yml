name: CloudForge CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt

      - name: Run Django checks
        working-directory: app/backend
        run: |
          python manage.py check


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/frontend/notes-frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend/notes-frontend
        run: npm ci

      - name: Build React application
        working-directory: app/frontend/notes-frontend
        env:
          REACT_APP_API_URL: ''
        run: npm run build


  docker:
    name: Build and Push Docker Images to ECR
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::024265812756:role/CloudForgeGitHubActionsECRRole
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: 024265812756.dkr.ecr.ap-south-2.amazonaws.com/cloudforge-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: 024265812756.dkr.ecr.ap-south-2.amazonaws.com/cloudforge-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend/notes-frontend
          file: ./app/frontend/notes-frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            REACT_APP_API_URL=

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster cloudforge-cluster \
            --service cloudforge-backend \
            --force-new-deployment \
            --region ap-south-2
          aws ecs wait services-stable \
            --cluster cloudforge-cluster \
            --services cloudforge-backend \
            --region ap-south-2

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster cloudforge-cluster \
            --service cloudforge-frontend \
            --force-new-deployment \
            --region ap-south-2
          aws ecs wait services-stable \
            --cluster cloudforge-cluster \
            --services cloudforge-frontend \
            --region ap-south-2
