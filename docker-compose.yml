services:

  postgres:
    image: postgres:16
    container_name: cloudforge-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data

    networks:
      - cloudforge

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile

    container_name: cloudforge-backend

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cloudforge

    restart: unless-stopped


  frontend:
    build:
      context: ./app/frontend/notes-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000

    container_name: cloudforge-frontend

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_started

    networks:
      - cloudforge

    restart: unless-stopped


volumes:
  cloudforge-postgres-data:
    name: cloudforge-postgres-data


networks:
  cloudforge:
    name: cloudforge
    driver: bridge