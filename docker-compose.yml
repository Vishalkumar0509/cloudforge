services:

  postgres:
    image: postgres:16
    container_name: cloudforge-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data

    networks:
      - cloudforge

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile

    container_name: cloudforge-backend

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CORS_ALLOW_ALL_ORIGINS: "True"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cloudforge

    restart: unless-stopped


  frontend:
    build:
      context: ./app/frontend/notes-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000

    container_name: cloudforge-frontend

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_started

    networks:
      - cloudforge

    restart: unless-stopped



  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cloudforge-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cloudforge
    restart: unless-stopped


  grafana:
    image: grafana/grafana:11.4.0
    container_name: cloudforge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-CloudForge Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - cloudforge
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  prometheus-data:
  grafana-data:
  cloudforge-postgres-data:
    name: cloudforge-postgres-data


networks:
  cloudforge:
    name: cloudforge
    driver: bridge
